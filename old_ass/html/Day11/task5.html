<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Media Showcase</title>
    </head>
    <body>
        <center>
                <header>
                    <h1><i>Media Showcase</i></h1>
                </header>
                    <main>
                        <h2>Image Gallery</h2>
                        <section>
                            <div>
                                <img src="assets/image/image1.jpg" alt="Nature" width="250" height="180">
                                <img src="assets/image/image2.jpg" alt="Mountain" width="250" height="180">
                                <img src="assets/image/image3.jpg" alt="Beach" width="250" height="180">
                            </div>
                        </section>
                        <hr>
                        <h2>Audio Player</h2>
                        <section>
                            <div>
                                <audio controls loop muted>
                                    <source src="assets/audio/audio1.mp3" type="audio/mp3" />
                                </audio>
                            </div>
                        </section>
                        <hr>
                        <h2>Video Player</h2>
                        <section>
                            <div>
                                <video controls width="600" height="300" poster="assets/image/image1.jpg">
                                    <source src="assets/video/video1.mp4" type="video/mp4" />
                                </video>
                            </div>
                        </section>
                        <hr>
                        <h2>YouTube Video</h2>
                        <section>
                            <div>
                                <iframe width="560" height="315" src="https://www.youtube.com/embed/PvKw4ljBohA?si=e-PxBhxCYXvkxEGN" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>        
                            </div>
                        </section>
                        <hr>
                        <h2>Google Map</h2>
                        <section>
                            <div>
                                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31448.562856659722!2d78.4640894429312!3d9.844458176185721!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3b00facfe87f2517%3A0x99cc213b48bfc694!2sSivaganga%2C%20Tamil%20Nadu!5e0!3m2!1sen!2sin!4v1784823098744!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                            </div>
                        </section>
                        <hr>
                        <h2>Embedded PDF</h2>
                        <section>
                            <div>
                               <iframe src="https://www.pvpsiddhartha.ac.in/dep_cse/lect_note/32/WT/WT_UNIT1.pdf" width="500" height="480" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                            </div>
                        </section><br><hr>
                    </main>
                <footer>
                    <p>&copy; 2026 Media Showcase. All Rights Reserved.</p>
                </footer>
        </center>
    </body>
</html>
