
<html>
<head>
    <title>HTML Elements</title>
</head>
<body>

    <!-- Heading-->
    <h1>Welcome to HTML Elements Demo</h1>

    <!-- Paragraph -->
    <p>This page demonstrates some commonly used HTML elements.</p>

    <!-- Bold Text -->
    <p><b>This text is bold.</b></p>

    <!-- Italic Text -->
    <p><i>This text is italic.</i></p>

    <!-- Highlighted Text -->
    <p><mark>This text is highlighted.</mark></p>

    <!-- Button -->
    <button>Click Me</button>

    <br><br>

    <!-- Input Field -->
    <label for="name">Name:</label>
    <input type="text" id="name" placeholder="Enter your name">

    <br><br>

    <!-- Dropdown -->
    <label for="course">Choose a Course:</label>
    <select id="course">
        <option value="">--Select--</option>
        <option>HTML</option>
        <option>CSS</option>
        <option>JavaScript</option>
    </select>

    <br><br>

    <!-- Textarea -->
    <label for="message">Message:</label><br>
    <textarea id="message" rows="5" cols="40" placeholder="Enter your message here"></textarea>

</body>
</html>
