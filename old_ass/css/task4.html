<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Departments</title>

    <style>
        body {
            text-align: center;
            background-color: #f5f5f5;
        }

        .department {
            width: 300px;
            height: 40px;
            text-align: center;
            color: white;
        }

        .cse {
            background-color: #3498db;
        }

        .it {
            background-color: #2ecc71;
        }

        .ece {
            background-color: #e67e22;
        }

        .eee {
            background-color: #9b59b6;
        }

        .mechanical {
            background-color: #e74c3c;
        }
    </style>
</head>
<body>

    <h1>Engineering Departments</h1>

    <div class="department cse">CSE</div>
    <div class="department it">IT</div>
    <div class="department ece">ECE</div>
    <div class="department eee">EEE</div>
    <div class="department mechanical">Mechanical</div>

</body>
</html>
