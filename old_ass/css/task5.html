<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite Things</title>

    <style>
        .place {
            background-color: lightgreen;
            color: black;
            width: 350px;
            height: 80px;
            text-align: center;
        }

        .actor {
            background-color: lightpink;
            color: black;
            width: 350px;
            height: 80px;
            text-align: center;
        }

        .sport {
            background-color: lightgray;
            color: black;
            width: 350px;
            height: 80px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div style="background-color: lightblue; color: black; width: 350px; height: 80px; text-align: center;">
        <b>Favorite Food:</b> Biryani
    </div>

    <div style="background-color: lightcoral; color: white; width: 350px; height: 80px; text-align: center;">
        <b>Favorite Movie:</b> Leo
    </div>

    <div class="place">
        <b>Favorite Place:</b> Ooty
    </div>

    <div class="actor">
        <b>Favorite Actor:</b> Vijay
    </div>

    <div class="sport">
        <b>Favorite Sport:</b> Cricket
    </div>

</body>
</html>
