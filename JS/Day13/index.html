
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM Tasks</title>
</head>
<body>

    <h1>JavaScript DOM</h1>


    <h2 id="heading"> Change Heading Color</h2>
    <button id="colorBtn">Change Color</button>


    <h2>Change Box Background</h2>

    <div id="box" style="background-color: white; color: black;">
        This is a box
    </div>

    <button id="blueBtn">Blue</button>
    <button id="yellowBtn">Yellow</button>


    <h2>Show and Hide</h2>

    <p id="para">This paragraph can be hidden and shown.</p>

    <button id="hideBtn">Hide</button>
    <button id="showBtn">Show</button>


    <h2>Toggle Show / Hide</h2>

    <h3 id="toggleHeading">This heading can be toggled.</h3>
    <button id="toggleBtn">Toggle Heading</button>


    <h2>Dark Mode / Light Mode</h2>

    <div id="themeBox">
        <h3>Welcome to My Website</h3>
        <p>Click the button to change the theme.</p>
    </div>

    <button id="themeBtn">Toggle Theme</button>

    <script src="assets/js/index.js"></script>

</body>
</html>
