<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Classroom Details</title>

    <style>
        .title {
            color: white;
            background-color: navy;
        }

        .section {
            color: black;
            background-color: lightgray;
        }

        .section-title {
            color: darkblue;
            background-color: lightblue;
        }

        .teacher {
            color: darkgreen;
            background-color: lightgreen;
        }

        .student {
            color: darkblue;
            background-color: lightcyan;
        }

        .topic {
            color: darkred;
            background-color: lightyellow;
        }

        .status {
            color: white;
            background-color: green;
        }
    </style>

</head>

<body>

    <h1 class="title">
        CSS Classroom Details
    </h1>


    <section class="section">

        <h2 class="section-title">
            Teacher Information
        </h2>

        <p class="teacher">
            Teacher Name: Mr. Kumar
        </p>

        <p class="teacher">
            Subject: CSS
        </p>

    </section>


    <section class="section">

        <h2 class="section-title">
            Student Information
        </h2>

        <p class="student">Arun</p>

        <p class="student">Priya</p>

        <p class="student">Kumar</p>

        <p class="student">Divya</p>

    </section>


    <section class="section">

        <h2 class="section-title">
            Today's Topics
        </h2>

        <p class="topic">HTML</p>

        <p class="topic">CSS</p>

        <p class="topic">JavaScript</p>

    </section>


    <section class="section">

        <h2 class="section-title">
            Class Status
        </h2>

        <p class="status">
            Class Started
        </p>

        <p class="status">
            Class In Progress
        </p>

        <p class="status">
            Class Completed
        </p>

    </section>

</body>

</html>
