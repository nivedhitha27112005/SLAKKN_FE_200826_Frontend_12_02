<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Boxes</title>

    <style>
        .product1 {
            width: 250px;
            padding: 20px;
            border: 3px solid green;
            margin: 15px;
            background-color: lightyellow;
        }

        .product2 {
            width: 250px;
            padding: 30px;
            border: 5px solid orange;
            margin: 25px;
            background-color: lightpink;
        }

        .product3 {
            width: 250px;
            padding: 15px;
            border: 4px solid purple;
            margin: 35px;
            background-color: lavender;
        }
    </style>
</head>

<body>

    <h1>Product Boxes</h1>

    <div class="product1">

        <h2>Laptop</h2>

        <p>Price: ₹50,000</p>

        <p>A powerful laptop for programming.</p>

    </div>


    <div class="product2">

        <h2>Smartphone</h2>

        <p>Price: ₹25,000</p>

        <p>A modern smartphone with excellent features.</p>

    </div>


    <div class="product3">

        <h2>Headphones</h2>

        <p>Price: ₹3,000</p>

        <p>Wireless headphones with high-quality sound.</p>

    </div>

</body>
</html>
