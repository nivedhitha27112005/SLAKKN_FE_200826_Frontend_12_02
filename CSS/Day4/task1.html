<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic Box Model</title>

    <style>
        .box {
            width: 300px;
            height: 150px;
            padding: 20px;
            border: 5px solid black;
            margin: 30px;
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>Basic Box Model</h1>

    <div class="box">
        <p>CSS (Cascading Style Sheets) is the language used to design and style the layout of web pages created with HTML. While HTML provides the raw structure (text, headings, images), CSS controls the visual presentation, including colors, fonts, spacing, and element positioning. </p>
    </div>

</body>
</html>
